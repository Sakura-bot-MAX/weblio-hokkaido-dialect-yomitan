name: Update dialect dictionaries

# The crawl touches roughly 25,000 pages on weblio.jp, so it runs weekly rather
# than daily. Pushes and manual runs only rebuild from the committed snapshots,
# which keeps CI quick and polite to the upstream site.

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  push:
    branches: [main]
    paths:
      - "src/**"
      - "dictionaries.json"
      - ".github/workflows/update.yml"
  workflow_dispatch:
    inputs:
      crawl:
        description: "Crawl weblio.jp before building"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: update-dialects
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Crawl weblio.jp
        if: github.event_name == 'schedule' || inputs.crawl
        run: node src/fetch-data.mjs

      - name: Build dictionaries
        run: node src/build.mjs

      - name: Build combined edition
        run: node src/build-merged.mjs

      - name: Refresh README catalogue
        run: node src/index-md.mjs

      # Publish before committing: publish.mjs rewrites dist/published.json with
      # the revisions that are now online, and the commit step below is what
      # records it. Running publish last meant the published state was never
      # committed, so every later run saw a stale record and re-uploaded all 24
      # releases.
      - name: Publish releases
        run: node src/publish.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOMITAN_REPO: ${{ github.repository }}

      - name: Commit snapshots and builds
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data dist output README.md
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Update dialect snapshots [skip ci]"
            git push
          fi
